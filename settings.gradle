pluginManagement {
	repositories {
		// Gradle Plugin Portal 优先（包含 Shadow 等插件）
		gradlePluginPortal()
		
		// Architectury 仓库必须在前面（包含 SNAPSHOT 版本）
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		
		mavenCentral()
		
		// 中国镜像源（作为备用）
		maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
		maven { url = 'https://maven.aliyun.com/repository/public/' }
		maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
	}
}

dependencyResolutionManagement {
	repositories {
		// 中国镜像源
		maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
		maven { url = 'https://maven.aliyun.com/repository/public/' }
		maven { url = 'https://repo.huaweicloud.com/repository/maven/' }
		
		mavenCentral()
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://api.modrinth.com/maven' }
		maven { url = 'https://maven.minecraftforge.net/' }
		// 可选依赖库的官方仓库
		maven { url = 'https://maven.shedaniel.me/' }          // Cloth Config
		maven { url = 'https://maven.blamejared.com/' }        // Patchouli / JEI
		maven { url = 'https://maven.theillusivec4.top/' }     // Curios API
		maven { url = 'https://maven.latvian.dev/releases' }   // KubeJS / Rhino
		maven { url = 'https://maven.parchmentmc.org/' }       // Parchment 映射

		// 仅从官方仓库解析 Forge 组件，避免无意义的回退请求
		exclusiveContent {
			forRepository {
				maven {
					name = 'Forge'
					url = 'https://maven.minecraftforge.net/'
				}
			}
			filter {
				includeGroup 'net.minecraftforge'
				includeGroupByRegex 'net\\.minecraftforge\\..*'
			}
		}
	}
}
rootProject.name = 'akaishi'
// 包含子项目（仅 Forge 平台）
// ① 科技本体：common + forge（modId = akaishi，既有源码零改动）
include 'common'
include 'forge'

// ② 赤石核心（API/基础设施，modId = akaishi_core）
// 项目名唯一（corecommon/coreforge），避免与既有 common/forge 冲突；
// architectury { common("forge") } 的参数是加载器枚举名而非项目名，平台侧用 project(path) 显式引用。
include 'corecommon'
project(':corecommon').projectDir = file('akaishi_core/common')
include 'coreforge'
project(':coreforge').projectDir = file('akaishi_core/forge')

// ③ 赤石禁忌（可选内容，modId = akaishi_forbidden），依赖核心 + 本体
include 'forbiddencommon'
project(':forbiddencommon').projectDir = file('akaishi_forbidden/common')
include 'forbiddenforge'
project(':forbiddenforge').projectDir = file('akaishi_forbidden/forge')