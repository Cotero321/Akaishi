plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "akaishi.mixins.json"
    }
    runs {
        client {
            client()
            name "Forge Client"
            runDir "run/client"
            vmArgs "-Dneoforge.enabledGameTestNamespace=akaishi"
            programArgs "--username", "Player1"
        }
        server {
            server()
            name "Forge Server"
            runDir "run/server"
            vmArgs "-Dneoforge.enabledGameTestNamespace=akaishi"
            // 转发测试开关：Gradle --system-prop 仅写入 Gradle JVM，JavaExec 子进程不继承，
            // 需显式将 akaishi.* 系统属性注入服务器 JVM（akaishi.gametest / akaishi.gametest.reactor 等）
            System.getProperties().stringPropertyNames().findAll { it.startsWith("akaishi.") }
                    .each { key -> vmArgs "-D$key=${System.getProperty(key)}" }
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
    
    // 排除不需要的文件
    exclude 'META-INF/versions/**'
    
    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()
    
    // 排除 module-info.class 避免 JPMS 冲突
    exclude 'module-info.class'

    // common 资源已并入 forge sourceSet，打包时与 shadowCommon 重复的条目去重
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'Akaishi Mod',
			'Specification-Vendor'    : 'Akaishi Author',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'Akaishi Author'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url "https://maven.minecraftforge.net/"
        name "Forge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
    maven {
        url "https://cursemaven.com"
        name "CurseMaven"
    }
    // 可选依赖库的官方仓库
    maven { url "https://maven.blamejared.com/" }          // Patchouli / JEI
    maven { url "https://maven.theillusivec4.top/" }       // Curios API
    maven { url "https://maven.latvian.dev/releases" }     // KubeJS / Rhino
    // GeckoLib（壁虎库）：3D 动画库，硬依赖，走官方 Cloudsmith 仓库
    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        name "GeckoLib"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: project.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'akaishi',
        mod_name: 'Akaishi Mod',
        mod_version: project.version,
        mod_authors: 'Akaishi Author',
        mod_description: 'Akaishi Mod for Architectury'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // Forge 平台
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-forge:9.2.14")
    include("dev.architectury:architectury-forge:9.2.14")

    // Cloth Config（配置 GUI 基础，硬依赖）
    modApi("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}")

    // GeckoLib（壁虎库，硬依赖）：3D 模型/动画库。
    // 用 modImplementation 而非 modCompileOnly —— 它不只是编译期 API：
    // 我们的 Geo 模型/动画在客户端与服务端都要走它的运行时管线（注册动画控制器、模型解析），
    // 软引用一旦被无条件使用就是 NoClassDefFoundError。声明为硬依赖后，
    // dev 运行（runClient/runServer）也会自动带上它，不必手动往 run/mods 里丢 jar。
    modImplementation("software.bernie.geckolib:geckolib-forge-1.20.1:${rootProject.geckolib_version}")

    // mclib：GeckoLib 的数学/插值库，被它以 Jar-in-Jar 内嵌在 META-INF/jarjar/mclib-20.jar。
    // 具体的补声明逻辑见本文件末尾「GeckoLib 的 mclib」段（必须在 dependencies 块之后）。

    // ===== 可选依赖（compileOnly 编译 + 运行时检测，不强制玩家安装） =====

    // Curios API：饰品槽（编译用官方推荐 API artifact，运行时为硬依赖，玩家必须安装 Curios）
    modCompileOnly("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}:api")
    modRuntimeOnly("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}")

    // Patchouli：模组手册
    modCompileOnly("vazkii.patchouli:Patchouli:${rootProject.patchouli_version}")
    modLocalRuntime("vazkii.patchouli:Patchouli:${rootProject.patchouli_version}")

    // JEI：配方展示（编译用 API artifact，运行时加载完整 jar）
    modCompileOnly("mezz.jei:jei-1.20.1-forge-api:${rootProject.jei_version}")
    modLocalRuntime("mezz.jei:jei-1.20.1-forge:${rootProject.jei_version}")

    // KubeJS：内容脚本化（后期实现绑定层，暂只声明）
    modCompileOnly("dev.latvian.mods:kubejs-forge:${rootProject.kubejs_version}")
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package: keep top-level network package only in common
        }
        resources {
            // 合并 common 模块资源（data/assets/lang）：FML 仅以 mod 文件（mods.toml）形式加载
            // 资源包/数据包，common 的 data 若不合并，dev 运行（runServer/runClient）将缺失全部
            // 配方/战利品/标签/语言/模型纹理，与发布 jar（transformProductionForge 已含 common 资源）不一致
            srcDir project(":common").sourceSets.main.resources
        }
    }
}

// 合并 common 资源后 forge 与 common 可能出现同名文件，去重避免 processResources 失败
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// dev 运行前强制重编 common：forge dev 直接加载 common/build/classes/java/main（无 common jar），
// 不重编会导致 common 改动不生效（IDE 的 bin/main 不参与运行）
tasks.matching { it.name in ["runClient", "runServer"] }.configureEach {
    dependsOn(":common:classes")
}

// ============================================================================
// GeckoLib 的 mclib：由本模组补回 jarJar 声明
// ----------------------------------------------------------------------------
// 为什么必须补（已用运行时探针实测确认，不是推断）：
//   Forge dev 中所有 mod 类都由同一个 cpw.mods.modlauncher.TransformingClassLoader 加载，
//   它 getParent() == null（隔离设计），因此普通 classpath 上的 jar 它一概看不见
//   （探针输出：java.class.path 含 mclib = true，但 Class.forName 抛 ClassNotFoundException）。
//   类要能被解析，只有两条路：① 该 jar 自身是 mod（含 mods.toml）；② 由某个 mod 通过 jarJar 声明。
//   mclib 是纯函数库、没有 mods.toml，只能走 ②；而 Loom 重映射 GeckoLib 时会把
//   META-INF/jarjar/metadata.json 丢掉（重映射后的 jar 里只剩 mclib-20.jar，没有元数据），
//   Forge 的 JarInJarDependencyLocator 就报 "No dependencies to load found"。
//   后果：GeckoLib 的 JsonUtil 静态初始化抛
//   NoClassDefFoundError: com/eliotlash/mclib/math/IValue，只要资源里存在 geo/动画就崩在加载界面。
// 做法：把 mclib 复制进本模组的 META-INF/jarjar，并补写一份 metadata.json
//   （内容与格式抄自 GeckoLib 原版 jar 内的同名文件）。
// ============================================================================
configurations.create("mclibJarJar") {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

dependencies {
    mclibJarJar "com.eliotlash.mclib:mclib:20"
}

def mclibMetadataFile = layout.buildDirectory.file("generated/jarjar/metadata.json")

def generateMclibJarJarMetadata = tasks.register("generateMclibJarJarMetadata") {
    def outFile = mclibMetadataFile
    outputs.file(outFile)
    doLast() {
        def f = outFile.get().asFile
        f.parentFile.mkdirs()
        f.text = '''{
  "jars": [
    {
      "identifier": {
        "group": "com.eliotlash.mclib",
        "artifact": "mclib"
      },
      "version": {
        "range": "[20,)",
        "artifactVersion": "20"
      },
      "path": "META-INF/jarjar/mclib-20.jar",
      "isObfuscated": false
    }
  ]
}
'''
    }
}

processResources {
    from(configurations.mclibJarJar) {
        into "META-INF/jarjar"
    }
    // 用 from(任务) 而非 from(路径)：只有前者能让 Gradle 推断出任务依赖，保证 metadata.json 先于复制生成
    from(generateMclibJarJarMetadata) {
        into "META-INF/jarjar"
    }
}

