// 根项目配置 - 多模块项目
plugins {
	id 'architectury-plugin' version '3.4-SNAPSHOT'
	id 'dev.architectury.loom' version '1.6-SNAPSHOT' apply false
}

architectury {
	minecraft = '1.20.1'
}

allprojects {
	apply plugin: 'java'
	apply plugin: 'architectury-plugin'
	
	group = maven_group
	version = '1.0.0-akaishi-1.20.1'
	
	repositories {
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.minecraftforge.net/' }
		maven { url = 'https://maven.shedaniel.me/' }
		maven { url = 'https://maven.terraformersmc.com/' }
		maven { url = 'https://maven.parchmentmc.org/' }
        // curseforge与modrinth平台仓库
        exclusiveContent {
            forRepository {
                maven {
                    name = 'CurseMaven'
                    url = 'https://cursemaven.com'
                }
            }
            filter {
                includeGroup 'curse.maven'
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }
		mavenCentral()
	}
	
	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 17
	}
	
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
		withSourcesJar()
	}
	
	// 关键：Gradle toolchain 默认只影响编译任务；runClient/Transformer 属于 JavaExec，
	// 若系统默认 JDK 为 21 可能触发 Architectury Transformer 的已知崩溃。
	// 这里强制所有 JavaExec 使用 Java 17 launcher，保证开发运行环境一致。
	tasks.withType(JavaExec).configureEach {
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(17)
		}
		// 设置运行游戏时的玩家名称
		systemProperty 'minecraft.username', rootProject.properties.getOrDefault('minecraft_username', 'Player')
	}
}

// ============================================================================
// dev 运行环境策略（集中一处声明，避免"每个模块都冒出一个 runClient"的混乱）
// ----------------------------------------------------------------------------
// 只有两个平台模块提供可用的 dev 运行环境：
//   :forge            = 核心 + 本体（2 模组）—— 同时用于验证"不装禁忌包"的场景
//   :forbiddenforge   = 核心 + 本体 + 禁忌（3 模组）—— 主力开发环境
// 其余模块（common / corecommon / coreforge / forbiddencommon）由 Loom 自动生成的
// run 任务是**空配置**（configName 为 null，无 runDir 与用户名），一律停用并清除分组，
// 使其不再作为"可运行任务"出现在 IDE 中。
// ============================================================================
def DEV_RUN_MODULES = ['forge', 'forbiddenforge'] as Set

subprojects { p ->
	if (!DEV_RUN_MODULES.contains(p.name)) {
		p.afterEvaluate {
			p.tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach { t ->
				t.enabled = false
				t.group = null
				t.description = '已停用：本模块不提供 dev 运行环境，请改用 :forge（2 模组）或 :forbiddenforge（3 模组）'
			}
		}
	}
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	
	base {
		archivesName = "${rootProject.name}-${project.name}"
	}
	
	loom {
		silentMojangMappingsLicense()
	}
	
	dependencies {
		minecraft "com.mojang:minecraft:1.20.1"
		// Mojang 映射 + Parchment 参数名，提升开发可读性（不影响运行时）
		mappings loom.layered {
			officialMojangMappings()
			parchment("org.parchmentmc.data:parchment-1.20.1:${project.parchment_version}")
		}
	}
	
}