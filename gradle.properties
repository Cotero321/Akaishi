org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3 
org.gradle.parallel=true

# 网络超时配置：依赖下载快速失败，避免无限挂起
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=30000
org.gradle.internal.repository.max.retries=1
org.gradle.internal.repository.initial.backoff=1000

# Gradle toolchain 检测的 JDK 安装路径（分号分隔）
# Gradle 默认只扫描 JAVA_HOME 与固定目录，本机 JDK17 装在 Zulu/Liberica/Microsoft 专属目录，需显式声明
org.gradle.java.installations.paths=C:/Program Files/Zulu/zulu-17,C:/Program Files/BellSoft/LibericaJDK-17,C:/Program Files/Microsoft/jdk-17.0.10.7-hotspot,C:/Program Files/Zulu/zulu-21,C:/Program Files/BellSoft/LibericaJDK-21

# Minecraft 版本
minecraft_version=1.20.1

# Mod Properties
maven_group=com.example.template

# Dependencies
forge_version=47.3.0

# 依赖库版本（统一管理）
cloth_config_version=11.1.106
curios_version=5.12.1+1.20.1
patchouli_version=1.20.1-81-FORGE
jei_version=15.3.0.4
kubejs_version=2001.6.4-build.138
parchment_version=2023.09.03

# 运行游戏时的人物名称
minecraft_username=Developer