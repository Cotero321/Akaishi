// 赤石禁忌（可选内容）—— common 侧骨架。
// 依赖方向单向：禁忌 → 本体(科技) + 核心；核心/本体绝不反向依赖禁忌。
architectury {
    common("forge")
}

repositories {
    // Curios API 官方仓库（饰品基类 API 需要，与本体 common 一致）
    maven { url "https://maven.theillusivec4.top/" }
    // GeckoLib（影怪几何动画模型/动画控制器需要）
    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        name "GeckoLib"
    }
    mavenCentral()
}

// 跨模组依赖用自定义配置而非 modImplementation：
// ArchLoom 会把 modImplementation 的项目依赖当"外部 mod"在配置期急切读取其 dev jar 元数据，
// 干净构建时该 jar 尚不存在会直接失败；本仓库既有的 common→forge 依赖同样用自定义配置实现。
configurations {
    coreCommon
    techCommon
    compileClasspath.extendsFrom coreCommon, techCommon
    runtimeClasspath.extendsFrom coreCommon, techCommon
}

dependencies {
    // Architectury API：注册表 / 菜单 / 网络包 / 环境判断都要用到。
    // 只取编译期与本地运行依赖、不 include：architectury 运行时由本体 akaishi 统一以 jar-in-jar 提供，
    // 避免同一 mod 被三份 jar 重复内嵌（见 §26.5 踩坑 5）。
    modImplementation("dev.architectury:architectury:9.2.14")

    // Gradle 侧跨模组依赖（编译 + 运行 classpath），与 forbiddenforge/mods.toml 的
    // [[dependencies.akaishi_forbidden]]（akaishi_core / akaishi）成对声明。
    coreCommon(project(path: ":corecommon", configuration: "namedElements")) { transitive false }
    techCommon(project(path: ":common", configuration: "namedElements")) { transitive false }

    // GeckoLib：影怪实体实现 GeoEntity、动画控制器用它的类；只取编译期 API 面，
    // 运行期由本模块 forge 侧的 modImplementation 提供真实 jar（不重复打包）。
    modCompileOnly("software.bernie.geckolib:geckolib-forge-1.20.1:${rootProject.geckolib_version}")

    // Curios API：花环饰品实现 ICurioItem 需要编译期 API（运行时由本体侧 Curios 提供完整 jar）
    modCompileOnly("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}:api")
}
