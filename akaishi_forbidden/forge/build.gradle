plugins {
    id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

// 启用 Loom 的 Forge 平台支持，并声明本模块自己的 mixin 配置
// （P3b：理智相关的 PlayerFoodExhaustionMixin / PostPassMixin 随理智系统迁入本模块）
loom {
    forge {
        mixinConfig "akaishi_forbidden.mixins.json"
    }
    // dev 运行环境：核心 + 本体 + 禁忌（3 模组）。
    // 本模块的运行 classpath 天然包含三者（见下方 crossMod 声明），
    // 是唯一能一次加载全部三个模组的入口；本体的 :forge:runClient 只加载 2 模组。
    runs {
        client {
            client()
            name "Client · 核心+本体+禁忌（3 模组）"
            runDir "run/client"
            programArgs "--username", "Player3"
        }
        server {
            server()
            name "Server · 核心+本体+禁忌（3 模组）"
            runDir "run/server"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.minecraftforge.net/"
        name "Forge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
    // GeckoLib（影怪几何动画渲染器需要的本模块硬依赖）
    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        name "GeckoLib"
    }
    // JEI（P3d：生命融合 / 母神祭坛 JEI 配方类别随内容迁入本模块）
    maven { url "https://maven.blamejared.com/" }
    // Curios API（P3d：禁忌四件饰品的 Curios 访问辅助/生效层随内容迁入本模块）
    maven { url "https://maven.theillusivec4.top/" }
}

// 产物名与 modId 对齐：akaishi_forbidden-<version>.jar
base {
    archivesName = "akaishi_forbidden"
}

configurations {
    common
    shadowCommon
    crossMod // 平台侧真实 mod（自带 mods.toml）：coreforge / forge
    crossCommon // common 侧无 mods.toml：corecommon / common，dev 下需经 transformer 注入为 fake mod 才可见
    compileClasspath.extendsFrom common, crossMod, crossCommon
    runtimeClasspath.extendsFrom common, crossMod, crossCommon
    developmentForge.extendsFrom common, crossCommon
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")

    // mclib 的 jarJar 补丁只对 dev 生效：ShadowJar 不会把嵌套 jar 打进发布产物（实测发布 jar 内只有
    // metadata.json，没有 mclib-20.jar），而发布环境由玩家安装的官方 GeckoLib 自带 mclib。
    // 为避免发布产物里留下「指向不存在文件」的悬空声明，这里把该 metadata 排除出发布产物。
    // dev 运行走 build/resources/main（两个文件都在），不受此排除影响。
    exclude 'META-INF/jarjar/metadata.json'
    exclude 'META-INF/versions/**'
    mergeServiceFiles()
    exclude 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

jar {
    archiveClassifier.set("dev")
    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
    manifest {
        attributes([
            'Specification-Title'    : 'Akaishi Forbidden Mod',
            'Specification-Vendor'   : 'Akaishi Author',
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.version,
            'Implementation-Vendor'  : 'Akaishi Author'
        ])
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version      : '1.20.1',
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version          : project.forge_version,
        forge_version_range    : '[47,48)',
        loader_version_range   : '[47,)',
        mod_id                 : 'akaishi_forbidden',
        mod_name               : 'Akaishi Forbidden',
        mod_version            : project.version,
        mod_authors            : 'Akaishi Author',
        mod_description        : 'Akaishi Forbidden - optional forbidden content'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // 本模块自身的 common 源码
    common(project(path: ":forbiddencommon", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":forbiddencommon", configuration: "transformProductionForge")) { transitive false }

    // Forge 平台
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ===== 跨模组依赖（Gradle 侧：编译 + 运行 classpath）=====
    // 单向：禁忌 → 核心 + 本体。平台类来自 *forge，common 类来自各自 common 子项目
    // （Architectury 的 common 与 forge 是两个独立项目，平台的 namedElements 不含 common 类）。
    // 与本模块 mods.toml 的 [[dependencies.akaishi_forbidden]]（akaishi_core / akaishi，mandatory + AFTER）成对声明。
    crossMod(project(path: ":coreforge", configuration: "namedElements")) { transitive false }
    crossMod(project(path: ":forge", configuration: "namedElements")) { transitive false }
    crossCommon(project(path: ":corecommon", configuration: "namedElements")) { transitive false }
    crossCommon(project(path: ":common", configuration: "namedElements")) { transitive false }

    // GeckoLib：影怪几何动画渲染器（GeoEntityRenderer / GeoModel / GeoRenderLayer）编译期与 dev 运行都需要。
    // 用 modImplementation 而非 modCompileOnly —— 它不只是编译期 API：影怪与 BOSS 阿盖托洛丝的
    // Geo 模型/动画在客户端与服务端都要走它的运行时管线（注册动画控制器、模型解析），
    // 软引用一旦被无条件使用就是 NoClassDefFoundError。声明为硬依赖后，
    // dev 运行（runClient/runServer）也会自动带上它，不必手动往 run/mods 里丢 jar。
    // 不 include：GeckoLib 是【禁忌模块自身】的硬依赖，由本模块声明（见本模块 mods.toml），
    // 运行时由玩家安装的 geckolib 提供，避免重复打包。
    // 注：GeckoLib 依赖暂挂在禁忌模块（本体已无 Geo 内容）；若日后本体重新需要 Geo 内容，
    //     需把本段与 mods.toml 依赖一并迁回本体。
    modImplementation("software.bernie.geckolib:geckolib-forge-1.20.1:${rootProject.geckolib_version}")

    // Architectury API：平台侧读 common 侧注册表字段（RegistrySupplier）需要编译期类型。
    // 只 compileOnly / 不 include：**发布版**的 architectury 由本体 jar-in-jar 唯一提供（见 forbiddencommon/build.gradle）。
    modCompileOnly("dev.architectury:architectury-forge:9.2.14")

    // ===== dev 运行时依赖（只影响 runClient/runServer，不进 jar）=====
    // 发布版中这些由本体（或玩家安装）提供；但 dev 运行不会从"别的模组的 build.gradle"继承依赖，
    // 缺了就是 NoClassDefFoundError。故此处显式补运行时（modRuntimeOnly 不打包，无重复内嵌风险）。
    modRuntimeOnly("dev.architectury:architectury-forge:9.2.14")
    // 本体配置系统（ModConfig / CurioSpecs）在运行时需要 Cloth Config
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}")
    // 禁忌四件饰品的生效层直接调 CuriosApi
    modRuntimeOnly("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}")

    // JEI：配方展示（P3d：AkaishiForbiddenJeiPlugin 注册生命融合 / 母神祭坛两个类别）。
    // 与本体同口径：编译用 API artifact，dev 运行加载完整 jar；非硬依赖（未装 JEI 时插件不被发现）。
    modCompileOnly("mezz.jei:jei-1.20.1-forge-api:${rootProject.jei_version}")
    modLocalRuntime("mezz.jei:jei-1.20.1-forge:${rootProject.jei_version}")

    // Curios API：禁忌四件饰品的生效层（AkaishiForbiddenCurios / AkaishiSocketEffectHandler）直接调 CuriosApi，
    // 需要编译期 API（运行时由玩家安装的 Curios 提供完整 jar；与本体同口径，非硬依赖）。
    modCompileOnly("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}:api")

    // 注：architectury / cloth-config 等由本体 akaishi 提供，不在此重复 include。
}

// Source JAR 组装（合并禁忌 common 源码）
sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":forbiddencommon").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        resources {
            srcDir project(":forbiddencommon").sourceSets.main.resources
        }
    }
}

// ============================================================================
// GeckoLib 的 mclib：由本模块补回 jarJar 声明
// ----------------------------------------------------------------------------
// 为什么必须补（已用运行时探针实测确认，不是推断）：
//   Forge dev 中所有 mod 类都由同一个 cpw.mods.modlauncher.TransformingClassLoader 加载，
//   它 getParent() == null（隔离设计），因此普通 classpath 上的 jar 它一概看不见
//   （探针输出：java.class.path 含 mclib = true，但 Class.forName 抛 ClassNotFoundException）。
//   类要能被解析，只有两条路：① 该 jar 自身是 mod（含 mods.toml）；② 由某个 mod 通过 jarJar 声明。
//   mclib 是纯函数库、没有 mods.toml，只能走 ②；而 Loom 重映射 GeckoLib 时会把
//   META-INF/jarjar/metadata.json 丢掉（重映射后的 jar 里只剩 mclib-20.jar，没有元数据），
//   Forge 的 JarInJarDependencyLocator 就报 "No dependencies to load found"。
//   后果：GeckoLib 的 JsonUtil 静态初始化抛
//   NoClassDefFoundError: com/eliotlash/mclib/math/IValue，只要资源里存在 geo/动画就崩在加载界面。
// 做法：把 mclib 复制进本模块的 META-INF/jarjar，并补写一份 metadata.json
//   （内容与格式抄自 GeckoLib 原版 jar 内的同名文件）。
// 归属：本段原挂在本体 forge，随 Geo 内容（影怪 / BOSS 阿盖托洛丝）一并迁入本模块；
//   由于 GeckoLib 现由本模块声明为硬依赖，mclib 的 jarJar 补声明的唯一真源也应在本模块。
// ============================================================================
configurations.create("mclibJarJar") {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

dependencies {
    mclibJarJar "com.eliotlash.mclib:mclib:20"
}

def mclibMetadataFile = layout.buildDirectory.file("generated/jarjar/metadata.json")

def generateMclibJarJarMetadata = tasks.register("generateMclibJarJarMetadata") {
    def outFile = mclibMetadataFile
    outputs.file(outFile)
    doLast() {
        def f = outFile.get().asFile
        f.parentFile.mkdirs()
        f.text = '''{
  "jars": [
    {
      "identifier": {
        "group": "com.eliotlash.mclib",
        "artifact": "mclib"
      },
      "version": {
        "range": "[20,)",
        "artifactVersion": "20"
      },
      "path": "META-INF/jarjar/mclib-20.jar",
      "isObfuscated": false
    }
  ]
}
'''
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(configurations.mclibJarJar) {
        into "META-INF/jarjar"
    }
    // 用 from(任务) 而非 from(路径)：只有前者能让 Gradle 推断出任务依赖，保证 metadata.json 先于复制生成
    from(generateMclibJarJarMetadata) {
        into "META-INF/jarjar"
    }
}

// dev 运行前先编出三个模块的 classes（dev 直接加载 build/classes 目录，无 jar 参与）
tasks.matching { it.name in ["runClient", "runServer"] }.configureEach {
    dependsOn(":forbiddencommon:classes", ":common:classes", ":corecommon:classes")
}
